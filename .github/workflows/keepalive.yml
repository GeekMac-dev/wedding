name: Supabase keepalive
on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert ping
        id: insert
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"pinged_at": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}')
          echo "status=$RESPONSE" >> $GITHUB_OUTPUT

      - name: Delete old pings (keep last 5)
        run: |
          CUTOFF_ID=$(curl -s \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?select=id&order=id.desc&limit=1&offset=4" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | \
            grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')

          if [ -n "$CUTOFF_ID" ]; then
            curl -s -X DELETE \
              "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?id=lt.$CUTOFF_ID" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            echo "Deleted pings older than id $CUTOFF_ID"
          else
            echo "Fewer than 5 pings exist, nothing to delete."
          fi

      - name: Done
        run: echo "Keepalive ping sent. HTTP ${{ steps.insert.outputs.status }}"
